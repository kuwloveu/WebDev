<div class="floating-header">
  <h1 class="title">Online Store</h1>
  <p class="tagline">Best gadgets for best prices</p>

  <div class="categories">
    <button
      *ngFor="let category of categories"
      class="category-btn"
      [class.active]="category.id === selectedCategoryId"
      (click)="selectCategory(category.id)">
      {{ category.name }}
    </button>
  </div>
</div>

<div class="welcome" *ngIf="selectedCategoryId === null">
  <h2>👋 Welcome!</h2>
  <p>Select a category above to browse products.</p>
</div>

<app-product-list
  *ngIf="selectedCategoryId !== null"
  [products]="filteredProducts">
</app-product-list>

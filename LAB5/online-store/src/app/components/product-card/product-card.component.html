<div class="card">

<div class="image-wrapper">
  <img [src]="allImages[currentImageIndex]" [alt]="product.name">
</div>

<div class="image-controls">
  <button (click)="prevImage()">‹</button>
  <button (click)="nextImage()">›</button>
</div>

<div class="divider"></div>

<div class="card-content">
  <h3 class="name">{{ product.name }}</h3>
  <p class="description">{{ product.description }}</p>
  <div class="price">{{ product.price | number:'1.0-0':'ru-RU' }} ₸</div>
  <div class="rating">⭐ {{ product.rating }}</div>

  <div class="actions">
    <button class="kaspi-button" (click)="openKaspi()">Kaspi</button>
    <button class="share-button" (click)="shareWhatsApp()">Share</button>
  </div>
</div>

</div>

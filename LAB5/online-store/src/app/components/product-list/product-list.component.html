<div class="grid" *ngIf="products.length > 0; else empty">
  <app-product-item
    *ngFor="let product of products"
    [product]="product"
    (like)="onLike($event)"
    (delete)="onDelete($event)">
  </app-product-item>
</div>

<ng-template #empty>
  <p class="empty-message">No products in this category.</p>
</ng-template>
